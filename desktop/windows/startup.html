<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saldo Fácil — Inicialização</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #20263b;
        background: #f4f6fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 360px;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        overflow: hidden;
        place-items: center;
        user-select: none;
        -webkit-app-region: drag;
      }

      body::-webkit-scrollbar { display: none; }

      main {
        width: 100%;
        padding: 32px 34px 28px;
        border: 1px solid #e6e9f2;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 18px 55px rgba(28, 38, 73, 0.12);
        text-align: center;
      }

      .brand-icon {
        display: grid;
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        place-items: center;
        border-radius: 18px;
        background: rgba(94, 114, 228, 0.12);
        color: #5e72e4;
        font-size: 30px;
        font-weight: 700;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #5e72e4;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 650;
      }

      .model {
        margin: 9px 0 24px;
        color: #737b90;
        font-size: 13px;
      }

      .progress {
        height: 7px;
        overflow: hidden;
        border-radius: 99px;
        background: #e9ecf5;
      }

      .progress span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #5e72e4;
        animation: progress 1.5s ease-in-out infinite;
      }

      .progress.error span {
        width: 100%;
        background: #d14343;
        animation: none;
      }

      .message {
        min-height: 38px;
        max-height: 4.5em;
        margin: 15px 0 0;
        color: #343b51;
        font-size: 13px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .message.error { color: #b52f36; }

      .hint {
        margin: 6px 0 0;
        color: #737b90;
        font-size: 12px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 22px;
        -webkit-app-region: no-drag;
      }

      button {
        min-height: 38px;
        padding: 0 15px;
        border: 1px solid #d9deeb;
        border-radius: 9px;
        background: #fff;
        color: #30374c;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        border-color: #5e72e4;
        background: #5e72e4;
        color: #fff;
      }

      button:hover { filter: brightness(0.97); }
      [hidden] { display: none !important; }

      @keyframes progress {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(270%); }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="brand-icon" aria-hidden="true">S</div>
      <p class="eyebrow">Saldo Fácil IA</p>
      <h1 id="title">Preparando seu aplicativo</h1>
      <p class="model">Claude2 Alpaca 7B Q6_K · modelo local</p>
      <div id="progress" class="progress" aria-label="Carregamento do modelo local">
        <span></span>
      </div>
      <p id="message" class="message">Iniciando o runtime local...</p>
      <p id="hint" class="hint">
        O primeiro carregamento pode levar alguns minutos. O aplicativo será aberto assim que estiver pronto.
      </p>
      <div class="actions">
        <button id="retry" class="primary" type="button" hidden>Tentar novamente</button>
        <button id="continue" type="button">Continuar sem IA</button>
      </div>
    </main>
    <script>
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const progress = document.getElementById('progress');
      const hint = document.getElementById('hint');
      const retry = document.getElementById('retry');
      const continueButton = document.getElementById('continue');

      function showStatus(status) {
        const isError = status.progress?.phase === 'error'
          || (!status.modelLoading && !status.modelReady);
        title.textContent = isError
          ? 'Não foi possível iniciar a IA'
          : status.modelReady
            ? 'Seu aplicativo está pronto'
            : 'Preparando seu aplicativo';
        message.textContent = status.progress?.message || status.message;
        message.classList.toggle('error', isError);
        progress.classList.toggle('error', isError);
        progress.hidden = isError;
        hint.hidden = isError;
        retry.hidden = !isError;
      }

      window.localStartup.onProgress(showStatus);
      window.localStartup.getStatus().then(showStatus).catch(error => {
        showStatus({
          modelLoading: false,
          modelReady: false,
          message: error instanceof Error ? error.message : 'Não foi possível consultar o runtime local.',
          progress: {
            phase: 'error',
            message: error instanceof Error ? error.message : 'Não foi possível consultar o runtime local.',
          },
        });
      });

      retry.addEventListener('click', async () => {
        retry.disabled = true;
        try {
          showStatus(await window.localStartup.retry());
        } finally {
          retry.disabled = false;
        }
      });
      continueButton.addEventListener('click', () => window.localStartup.continueWithoutAI());
    </script>
  </body>
</html>
