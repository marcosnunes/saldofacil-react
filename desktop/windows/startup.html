<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saldo Fácil — Inicialização</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #20263b;
        background: transparent;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-width: 360px;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        overflow: hidden;
        place-items: center;
        user-select: none;
        -webkit-app-region: drag;
      }

      body::-webkit-scrollbar { display: none; }

      main {
        width: 100%;
        padding: 32px 34px 28px;
        border: 1px solid rgba(94, 114, 228, 0.16);
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 24px 80px rgba(13, 22, 52, 0.28);
        text-align: center;
      }

      .art {
        position: relative;
        width: 132px;
        height: 132px;
        margin: 0 auto 18px;
      }

      .orbit {
        position: absolute;
        inset: 11px;
        border: 2px dashed rgba(94, 114, 228, 0.34);
        border-radius: 50%;
        animation: orbit 8s linear infinite;
      }

      .orbit.two {
        inset: 25px 4px;
        border-color: rgba(45, 206, 137, 0.4);
        animation-direction: reverse;
        transform: rotate(-34deg);
      }

      .coin {
        position: absolute;
        top: 36px;
        left: 36px;
        display: grid;
        width: 60px;
        height: 60px;
        place-items: center;
        border-radius: 50%;
        background: linear-gradient(145deg, #ffe895, #f5b82e);
        box-shadow: 0 8px 20px rgba(207, 148, 23, 0.28);
        color: #80580c;
        font-size: 30px;
        font-weight: 800;
        animation: bob 1.8s ease-in-out infinite;
      }

      .spark {
        position: absolute;
        top: 15px;
        right: 8px;
        color: #5e72e4;
        font-size: 22px;
        animation: sparkle 1.4s ease-in-out infinite alternate;
      }

      .spark.two {
        top: auto;
        right: auto;
        bottom: 17px;
        left: 8px;
        color: #2dce89;
        font-size: 17px;
        animation-delay: 350ms;
      }

      .dots {
        display: flex;
        justify-content: center;
        gap: 7px;
        margin-top: 12px;
      }

      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #5e72e4;
        animation: dot 900ms ease-in-out infinite;
      }

      .dots span:nth-child(2) { animation-delay: 150ms; }
      .dots span:nth-child(3) { animation-delay: 300ms; }

      .eyebrow {
        margin: 0 0 8px;
        color: #5e72e4;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 650;
      }

      .model {
        margin: 9px 0 24px;
        color: #737b90;
        font-size: 13px;
      }

      .fun {
        min-height: 20px;
        margin: 12px 0 0;
        color: #5e72e4;
        font-size: 13px;
        font-weight: 600;
      }

      .message {
        min-height: 38px;
        max-height: 4.5em;
        margin: 15px 0 0;
        color: #343b51;
        font-size: 13px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        overflow: hidden;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .message.error { color: #b52f36; }

      .hint {
        margin: 6px 0 0;
        color: #737b90;
        font-size: 12px;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 22px;
        -webkit-app-region: no-drag;
      }

      button {
        min-height: 38px;
        padding: 0 15px;
        border: 1px solid #d9deeb;
        border-radius: 9px;
        background: #fff;
        color: #30374c;
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      button.primary {
        border-color: #5e72e4;
        background: #5e72e4;
        color: #fff;
      }

      button:hover { filter: brightness(0.97); }
      [hidden] { display: none !important; }

      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes bob {
        0%, 100% { transform: translateY(2px) rotate(-7deg); }
        50% { transform: translateY(-5px) rotate(7deg); }
      }
      @keyframes sparkle {
        from { opacity: 0.55; transform: scale(0.8) rotate(-12deg); }
        to { opacity: 1; transform: scale(1.15) rotate(12deg); }
      }
      @keyframes dot {
        0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
        30% { opacity: 1; transform: translateY(-5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .orbit, .coin, .spark, .dots span {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div id="art" class="art" aria-hidden="true">
        <div class="orbit"></div>
        <div class="orbit two"></div>
        <div class="coin">$</div>
        <span class="spark">✦</span>
        <span class="spark two">✦</span>
      </div>
      <p class="eyebrow">Saldo Fácil IA</p>
      <h1 id="title">Preparando seu aplicativo</h1>
      <p class="model">Claude2 Alpaca 7B Q4_K_M · modelo local</p>
      <p id="fun" class="fun">Contando as moedinhas...</p>
      <div id="dots" class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <p id="message" class="message">Iniciando o runtime local...</p>
      <p id="hint" class="hint">
        O primeiro carregamento pode levar alguns minutos. O aplicativo será aberto assim que estiver pronto.
      </p>
      <div class="actions">
        <button id="retry" class="primary" type="button" hidden>Tentar novamente</button>
        <button id="continue" type="button">Continuar sem IA</button>
      </div>
    </main>
    <script>
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const art = document.getElementById('art');
      const dots = document.getElementById('dots');
      const fun = document.getElementById('fun');
      const funMessages = [
        'Contando as moedinhas...',
        'Organizando o cofrinho...',
        'Acordando a IA financeira...',
        'Somando centavo por centavo...',
        'Polindo os gráficos...',
      ];
      let funIndex = 0;
      setInterval(() => {
        funIndex = (funIndex + 1) % funMessages.length;
        fun.textContent = funMessages[funIndex];
      }, 2600);
      const hint = document.getElementById('hint');
      const retry = document.getElementById('retry');
      const continueButton = document.getElementById('continue');

      function showStatus(status) {
        const isError = status.progress?.phase === 'error'
          || (!status.modelLoading && !status.modelReady);
        title.textContent = isError
          ? 'Não foi possível iniciar a IA'
          : status.modelReady
            ? 'Seu aplicativo está pronto'
            : 'Preparando seu aplicativo';
        message.textContent = status.progress?.message || status.message;
        message.classList.toggle('error', isError);
        art.hidden = isError;
        dots.hidden = isError;
        fun.hidden = isError;
        hint.hidden = isError;
        retry.hidden = !isError;
      }

      window.localStartup.onProgress(showStatus);
      window.localStartup.getStatus().then(showStatus).catch(error => {
        showStatus({
          modelLoading: false,
          modelReady: false,
          message: error instanceof Error ? error.message : 'Não foi possível consultar o runtime local.',
          progress: {
            phase: 'error',
            message: error instanceof Error ? error.message : 'Não foi possível consultar o runtime local.',
          },
        });
      });

      retry.addEventListener('click', async () => {
        retry.disabled = true;
        try {
          showStatus(await window.localStartup.retry());
        } finally {
          retry.disabled = false;
        }
      });
      continueButton.addEventListener('click', () => {
        continueButton.disabled = true;
        retry.hidden = true;
        title.textContent = 'Abrindo sem a IA';
        message.textContent = 'Interrompendo o carregamento do modelo e abrindo o aplicativo...';
        message.classList.remove('error');
        window.localStartup.continueWithoutAI();
      });
    </script>
  </body>
</html>
